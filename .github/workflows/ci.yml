name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # node --check only looks at its first argument, so check each file in turn.
      - name: Check syntax
        run: |
          for file in index.js shadowtools.js lib/*.js test/*.js; do
            node --check "$file"
          done

      - name: Run tests
        run: npm test

      - name: Check the CLI starts and prints help
        run: node shadowtools.js --help

      - name: Check the module exports load
        run: |
          node -e '
            const api = require("./");
            for (const name of ["listKeys", "getUsage", "getKeys", "OutlineClient"]) {
              if (!api[name]) throw new Error("missing export: " + name);
            }
          '

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
